name: linters

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  lint:
    uses: veraison/ci/.github/workflows/go.yml@main
    with:
      jobs: 'lint'
      # the mocks are generated, the linter needs them to type-check the tests
      setup: |
        go install go.uber.org/mock/mockgen@v0.6.0
        make _mocks
